# 검증 — 정적 검사 · 테스트 · 빌드를 세 job 으로 나눠 동시에 돌린다.
# 왜 이렇게 나눴고 왜 build 가 여기 있는지: docs/03-setup/05-ci.md
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 공개 저장소라 fork PR 도 여기서 돈다. CI 는 코드를 읽기만 하면 된다.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@^26.12.1
          cache: true

      # 설치는 pnpm/setup 이 이미 했다. engineStrict 가 Node 범위를 여기서 막는다.
      - run: node -v && pnpm -v

      # Tailwind 디자인 시스템 캐시. 비어 있으면 `pnpm lint` 가 0.6s → 3.8s 가 된다.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oxlint-tailwindcss
          key: oxlint-tw-${{ runner.os }}-${{ hashFiles('packages/tailwind-config/theme.css', 'pnpm-lock.yaml') }}

      - run: pnpm lint
        env:
          OXLINT_TAILWINDCSS_CACHE_DIR: ${{ runner.temp }}/oxlint-tailwindcss
      - run: pnpm lint:docker
      - run: pnpm typecheck
      - run: pnpm format:check

  # 빌드 없이 돈다(워크스페이스 src 를 alias 로 가리킨다). 목록: docs/06-testing/01-test-plan.md
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@^26.12.1
          cache: true

      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@^26.12.1
          cache: true

      # 프리렌더가 remote SSR 번들을 실제로 받아 실행한다 — 이 저장소의 MF 계약 테스트다.
      - run: pnpm build

      # 커밋된 MF DTS 가 방금 빌드한 remote 와 같은가. 근거: docs/03-setup/05-ci.md
      - name: MF DTS 가 최신인지 확인
        run: |
          node scripts/serve-all-remotes.ts -- pnpm mf:types
          git diff --exit-code \
            -- packages/contracts/src/generated \
            || { echo "::error::커밋된 MF 타입/모듈 목록이 낡았습니다. 로컬에서 'pnpm mf:types' 를 돌리고 결과를 커밋하세요."; exit 1; }
