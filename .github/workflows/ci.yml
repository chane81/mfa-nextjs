# 검증 — 정적 검사 · 테스트 · 빌드를 각각 따로 돌린다.
#
# ## 왜 build 가 여기 있나
#
# 이 저장소에서 host 의 `next build` 는 순수 컴파일이 아니다. 프리렌더가 remote 의 SSR
# 번들을 HTTP 로 받아 **실제로 실행해본다**(`apps/host/src/mf/server-loader.ts`).
# 그래서 빌드가 통과한다는 건 "Next 16 에서 런타임 MF + SSR 이 된다"는 이 저장소의 유일한
# 주장이 아직 참이라는 뜻이다. 빌드를 빼면 그 주장이 깨져도 PR 이 초록으로 통과한다.
#
# ## 왜 세 job 인가
#
# 나눈 이유는 피드백 속도와 **실패 원인의 분리**다.
#
# | job     | 무엇                              | 대략 |
# | ------- | --------------------------------- | ---- |
# | verify  | lint · typecheck · format:check   | 짧다 |
# | test    | vitest 단위 · 통합 (39파일 616개) | 중간 |
# | build   | remote → host, 프리렌더가 SSR 실행 | 길다 |
#
# 셋은 서로 의존하지 않아 동시에 돈다. 붙여두면 빠른 신호가 느린 신호를 기다리고,
# 무엇보다 체크 이름만 보고는 "포맷이 틀렸나 테스트가 깨졌나"를 구분할 수 없다.
#
# remote → host 순서와 빌드 중 dist 서빙은 turbo 와 host 의 build 스크립트가 처리한다.
# 배경: docs/03-setup/01-getting-started.md 의 "host 빌드는 remote 가 떠 있어야 끝난다"
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 이 저장소는 공개다. fork 가 연 PR 도 여기서 `pnpm build` 를 돌린다 —
# 그 워크플로가 받는 GITHUB_TOKEN 이 무엇을 할 수 있는지 기본값에 맡기지 않는다.
# CI 는 코드를 읽기만 하면 된다. 쓰기 권한은 mf-revalidate 쪽에도 필요 없다(시크릿만 쓴다).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@^24.19.0
          cache: true

      # `pnpm install` 은 pnpm/setup 이 이미 돌렸다(install 기본값 true).
      # pnpm-workspace.yaml 의 engineStrict: true 덕에 Node 가 범위를 벗어나면
      # 여기서 ERR_PNPM_UNSUPPORTED_ENGINE 으로 죽는다.
      - run: node -v && pnpm -v

      # `lint` · `typecheck` 는 루트 스크립트가 turbo 로 패키지 태스크와 루트 태스크
      # (`lint:scripts` · `lint:tests` · `typecheck:scripts` · `typecheck:tests`)를
      # 함께 돌린다 — 테스트 코드의 타입·린트도 여기서 걸린다.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  # 단위 · 통합 테스트. 워크스페이스 패키지의 src 를 alias 로 직접 가리키므로 빌드 없이
  # 돈다 — build job 에 얹을 이유가 없다. 목록과 배경: docs/06-testing/01-test-plan.md
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 세 job 이 같은 캐시 키를 공유한다(같은 lockfile · 같은 Node 범위).
      - uses: pnpm/setup@v2
        with:
          runtime: node@^24.19.0
          cache: true

      # `pnpm test` 는 일부러 turbo 를 안 탄다 — 패키지별 대응 태스크가 없어 얻는 게
      # 캐시뿐인데, 그 대가로 `--project=dom` 같은 러너 플래그가 turbo 에 먹힌다.
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@^24.19.0
          cache: true

      # turbo 가 `@mfa/host#build.dependsOn` 으로 remote 를 먼저 빌드하고,
      # host 의 build 스크립트가 concurrently 로 그 dist 를 서빙하며 next build 를 돌린다.
      # 프리렌더가 remote SSR 번들을 실제로 fetch + 평가하므로, 여기가 MF 계약 테스트다.
      - run: pnpm build

      # 커밋된 MF DTS 가 방금 빌드한 remote 와 같은가.
      #
      # `packages/contracts/src/generated/` 는 생성물인데도 커밋한다 — `remote-contract.ts`
      # 가 그 타입과 목록을 실제로 쓰기 때문이다. 안 그러면
      # `pnpm typecheck` 가 remote 기동을 요구하게 되고, 그건 이 저장소가 DTS 를 오래
      # 껐던 바로 그 이유다.
      #
      # 대가는 낡을 수 있다는 것이고, 그걸 여기서 잡는다. remote 의 props 를 고치고
      # `pnpm mf:types` 를 안 돌리면 host 는 **옛 타입으로 통과한다** — 위 typecheck 는
      # 커밋된 파일만 보므로 그 어긋남을 못 본다. 이 단계가 그 창을 닫는다.
      #
      # 바로 위 `pnpm build` 가 remote dist 를 이미 만들어 뒀으므로 정적 서버만 띄우면
      # 된다. `--success first` 로 페치가 끝나면 서버가 내려간다.
      - name: MF DTS 가 최신인지 확인
        run: |
          pnpm --filter @mfa/contracts exec concurrently \
            --kill-others --success first -n catalog,cart,types \
            "node ../../scripts/serve-remote-dist.ts catalog" \
            "node ../../scripts/serve-remote-dist.ts cart" \
            "pnpm mf:types"
          git diff --exit-code \
            -- packages/contracts/src/generated \
            || { echo "::error::커밋된 MF 타입/모듈 목록이 낡았습니다. 로컬에서 'pnpm mf:types' 를 돌리고 결과를 커밋하세요."; exit 1; }
