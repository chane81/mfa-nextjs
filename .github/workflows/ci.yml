# 검증 — 빠른 정적 검사와 빌드를 따로 돌린다.
#
# ## 왜 build 가 여기 있나
#
# 이 저장소에서 host 의 `next build` 는 순수 컴파일이 아니다. 프리렌더가 remote 의 SSR
# 번들을 HTTP 로 받아 **실제로 실행해본다**(`apps/host/src/mf/server-loader.ts`).
# 그래서 빌드가 통과한다는 건 "Next 16 에서 런타임 MF + SSR 이 된다"는 이 저장소의 유일한
# 주장이 아직 참이라는 뜻이다. 빌드를 빼면 그 주장이 깨져도 PR 이 초록으로 통과한다.
#
# 두 job 으로 나눈 이유는 피드백 속도다. lint·typecheck·format 은 분 단위로 끝나고,
# build 는 네이티브 바이너리(rspack·swc)를 받느라 훨씬 오래 걸린다. 붙여두면 빠른 신호가
# 느린 신호를 기다리게 된다.
#
# remote → host 순서와 빌드 중 dist 서빙은 turbo 와 host 의 build 스크립트가 처리한다.
# 배경: docs/03-setup/01-getting-started.md 의 "host 빌드는 remote 가 떠 있어야 끝난다"
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@^24.19.0
          cache: true

      # `pnpm install` 은 pnpm/setup 이 이미 돌렸다(install 기본값 true).
      # pnpm-workspace.yaml 의 engineStrict: true 덕에 Node 가 범위를 벗어나면
      # 여기서 ERR_PNPM_UNSUPPORTED_ENGINE 으로 죽는다.
      - run: node -v && pnpm -v

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

      # 단위 · 통합 테스트. 워크스페이스 패키지의 src 를 alias 로 직접 가리키므로
      # 빌드 없이 돈다 — 그래서 느린 build job 이 아니라 여기 붙는다.
      # 목록과 배경: docs/06-testing/01-test-plan.md
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # verify 와 캐시 키를 공유한다 — 저장 경합 경고는 verify job 쪽 주석 참고.
      - uses: pnpm/setup@v2
        with:
          runtime: node@^24.19.0
          cache: true

      # turbo 가 `@mfa/host#build.dependsOn` 으로 remote 를 먼저 빌드하고,
      # host 의 build 스크립트가 concurrently 로 그 dist 를 서빙하며 next build 를 돌린다.
      # 프리렌더가 remote SSR 번들을 실제로 fetch + 평가하므로, 여기가 MF 계약 테스트다.
      - run: pnpm build
