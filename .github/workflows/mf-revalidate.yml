# remote 재배포 → host 캐시 무효화
#
# remote 를 따로 배포하면 host 는 바뀐 사실을 알 방법이 없다. host 의 페이지 캐시는
# 옛 remote 마크업을 계속 서빙한다. Dokploy 에는 배포 후 훅이 없어서
# (docs/03-setup/04-dokploy.md 참고) 그 자리를 이 워크플로가 맡는다.
#
# ## 이 워크플로가 배포를 시키는 게 아니다
#
# Dokploy 가 push 를 직접 받아 자기 리듬대로 빌드한다. 여기서 하는 일은
# **새 버전이 공개될 때까지 기다렸다가 host 에 알리는 것**뿐이다. 그래서 순서가
# push → (Dokploy 빌드) → mf-version.json 갱신 → 웹훅 이다.
#
# ## 왜 버전 변화를 기다리나
#
# 빌드가 끝나기 전에 웹훅을 때리면 host 는 **옛 remote 로** 페이지를 다시 굽는다.
# 캐시만 리셋되고 내용은 그대로라, 진짜 새 버전이 떴을 때 아무도 알리지 않는 상태가 된다.
name: mf-revalidate

on:
  push:
    branches: [main]
    # Dokploy 의 Watch Paths 와 같은 경로다. 공유 패키지가 바뀌면 remote 도 다시 빌드된다.
    paths:
      - 'apps/remote-catalog/**'
      - 'apps/remote-cart/**'
      - 'packages/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      remote:
        description: '무효화할 remote'
        type: choice
        options: [all, catalog, cart]
        default: all

# 무효화는 건너뛰면 안 된다. 뒤 실행이 앞 실행을 취소하면 그 배포는 아무도 알리지 못한다.
concurrency:
  group: mf-revalidate-${{ github.ref }}
  cancel-in-progress: false

env:
  # 도메인이 바뀌면 저장소 Variables 로 덮는다. 기본값은 현재 배포 구성이다.
  HOST_URL: ${{ vars.MF_HOST_URL || 'https://mfa.lakegreen.net' }}
  CATALOG_URL: ${{ vars.MF_CATALOG_URL || 'https://mfa-catalog.lakegreen.net' }}
  CART_URL: ${{ vars.MF_CART_URL || 'https://mfa-cart.lakegreen.net' }}

jobs:
  detect:
    name: 바뀐 remote 판별
    runs-on: ubuntu-latest
    outputs:
      remotes: ${{ steps.pick.outputs.remotes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: pick
        name: 대상 remote 결정
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REMOTE: ${{ inputs.remote }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_REMOTE" in
              all) REMOTES='["catalog","cart"]' ;;
              *)   REMOTES="[\"$INPUT_REMOTE\"]" ;;
            esac
            echo "remotes=$REMOTES" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 첫 푸시·force push 후에는 BEFORE 커밋이 없을 수 있다. 그때는 전부 대상으로 본다.
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "remotes=[\"catalog\",\"cart\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "$AFTER")"

          # 공유 코드가 바뀌면 두 remote 가 모두 다시 빌드된다 (Dokploy Watch Paths 와 동일한 판단).
          if echo "$CHANGED" | grep -qE '^(packages/|scripts/|pnpm-lock\.yaml)'; then
            echo "remotes=[\"catalog\",\"cart\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `grep -q ... && SELECTED+=(…)` 는 못 쓴다. 매치가 없으면 그 문장 전체가
          # 실패로 끝나 `set -e` 가 스크립트를 죽인다.
          SELECTED=()
          if echo "$CHANGED" | grep -q '^apps/remote-catalog/'; then SELECTED+=('"catalog"'); fi
          if echo "$CHANGED" | grep -q '^apps/remote-cart/'; then SELECTED+=('"cart"'); fi

          if [ ${#SELECTED[@]} -eq 0 ]; then
            echo "remotes=[]" >> "$GITHUB_OUTPUT"
          else
            IFS=,
            echo "remotes=[${SELECTED[*]}]" >> "$GITHUB_OUTPUT"
          fi

  revalidate:
    name: ${{ matrix.remote }} 무효화
    needs: detect
    if: needs.detect.outputs.remotes != '[]'
    runs-on: ubuntu-latest
    strategy:
      # 한 remote 가 실패해도 다른 remote 는 끝까지 간다. 둘은 독립된 배포다.
      fail-fast: false
      matrix:
        remote: ${{ fromJSON(needs.detect.outputs.remotes) }}
    steps:
      - id: baseline
        name: 배포 전 버전 기록
        env:
          REMOTE: ${{ matrix.remote }}
        run: |
          set -euo pipefail
          REMOTE_URL="$([ "$REMOTE" = catalog ] && echo "$CATALOG_URL" || echo "$CART_URL")"
          echo "remote_url=$REMOTE_URL" >> "$GITHUB_OUTPUT"

          # 아직 Dokploy 빌드가 도는 중이라 여기서 읽히는 값이 **옛 버전**이다.
          # 못 읽어도 진행한다 — 첫 배포이거나 remote 가 잠깐 안 뜬 것이고,
          # 그 경우 아래 대기 루프는 "버전이 생길 때까지" 기다리는 일이 된다.
          BEFORE="$(curl -fsS --max-time 10 "$REMOTE_URL/mf-version.json" | jq -r '.version' || echo '')"
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "배포 전 버전: ${BEFORE:-(읽지 못함)}"

      - name: 새 버전 공개까지 대기
        # 수동 실행은 "이미 배포했으니 지금 무효화해라"는 뜻이다. 기다릴 대상이 없다.
        if: github.event_name != 'workflow_dispatch'
        env:
          REMOTE_URL: ${{ steps.baseline.outputs.remote_url }}
          BEFORE: ${{ steps.baseline.outputs.before }}
          # Dokploy 빌드 시간. 캐시 히트면 1분 이내, 콜드 빌드는 몇 분 걸린다.
          TIMEOUT_SECONDS: '1200'
          INTERVAL_SECONDS: '15'
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + TIMEOUT_SECONDS ))

          while :; do
            NOW="$(curl -fsS --max-time 10 "$REMOTE_URL/mf-version.json" | jq -r '.version' 2>/dev/null || echo '')"

            if [ -n "$NOW" ] && [ "$NOW" != "$BEFORE" ]; then
              echo "새 버전 공개됨: $NOW"
              exit 0
            fi

            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::${TIMEOUT_SECONDS}초 안에 새 버전이 공개되지 않았다 (여전히 ${NOW:-없음})."
              echo "Dokploy 배포가 실패했거나 Watch Paths 에 안 걸려 아예 시작되지 않았을 수 있다."
              # 웹훅을 부르지 않고 실패시킨다. 옛 버전을 데우는 건 무효화의 의미가 없고,
              # 진짜 배포가 나중에 끝나면 그때 알릴 사람이 없어진다 — 눈에 띄게 빨갛게 둔다.
              exit 1
            fi

            sleep "$INTERVAL_SECONDS"
          done

      - name: host 캐시 무효화
        env:
          REMOTE: ${{ matrix.remote }}
          MF_REVALIDATE_SECRET: ${{ secrets.MF_REVALIDATE_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${MF_REVALIDATE_SECRET:-}" ]; then
            echo "::error::MF_REVALIDATE_SECRET 이 없다. Dokploy 의 host 런타임 env 와 같은 값을 저장소 Secret 으로 넣는다."
            exit 1
          fi

          # 웹훅은 warm 을 먼저 하고 실패하면 캐시를 건드리지 않은 채 502 로 중단한다.
          # 그래서 재시도가 안전하다 — 부분 적용 상태가 생기지 않는다.
          # 롤링 배포 직후에는 옛 태스크가 잠깐 응답할 수 있어 몇 번은 실패할 수 있다.
          for ATTEMPT in 1 2 3 4 5; do
            BODY="$(curl -sS --max-time 60 -w '\n%{http_code}' \
              -X POST "$HOST_URL/api/mf-revalidate" \
              -H "x-mf-secret: $MF_REVALIDATE_SECRET" \
              -H 'content-type: application/json' \
              -d "{\"remote\":\"$REMOTE\"}" || true)"

            STATUS="$(echo "$BODY" | tail -n1)"
            JSON="$(echo "$BODY" | sed '$d')"

            if [ "$STATUS" = "200" ] && [ "$(echo "$JSON" | jq -r '.ok')" = "true" ]; then
              VERSION="$(echo "$JSON" | jq -r '.version')"
              WARMED="$(echo "$JSON" | jq -r '.warmed')"
              echo "무효화 완료 — version=$VERSION warmed=$WARMED"
              {
                echo "### $REMOTE"
                echo ""
                echo "- 버전: \`$VERSION\`"
                echo "- warm: \`$WARMED\`"
                echo "- 시도: $ATTEMPT 회"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "시도 $ATTEMPT 실패 (HTTP $STATUS): $(echo "$JSON" | jq -c '.' 2>/dev/null || echo "$JSON")"
            sleep $(( ATTEMPT * 10 ))
          done

          echo "::error::웹훅이 5회 모두 실패했다. host 페이지 캐시는 그대로다(웹훅이 캐시를 건드리기 전에 중단한다)."
          exit 1
