# 배포 파이프라인 — 순서는 여기서 만든다
#
# ## 왜 GitHub Actions 가 순서를 쥐나
#
# Dokploy 에는 **앱 사이의 순서 개념이 없다.** 앱마다 "이 경로가 바뀌면 나를 빌드해라"
# (Watch Paths)가 있을 뿐이라, 한 push 가 세 앱을 동시에 물면 누가 먼저 끝날지 모른다.
# 공식 문서도 순서가 필요하면 CI 에서 API 로 트리거하라고 말한다
# (docs.dokploy.com — Auto deploy > API Method, `POST /api/application.deploy`).
#
# ## 순서가 왜 필요한가 — 버전 스큐
#
# host 는 커밋된 MF DTS 로 컴파일되지만 런타임에는 **배포된** remote 를 받는다
# (`mf-version.json` 이 공표한 버전으로 핀한다). 그래서 host 가 먼저 뜨면
# **새 host 코드 + 옛 remote 번들** 조합이 생긴다. 타입 검사는 이걸 못 잡는다 —
# 양쪽 다 같은 커밋의 타입으로 컴파일되기 때문이다.
#
#   필수 prop 추가·이름 변경 → 옛 컴포넌트가 `undefined` 를 받는다 → 터지거나 오동작
#   옵셔널 prop 추가         → 옛 컴포넌트가 조용히 무시한다 (에러가 안 나서 더 위험)
#
# remote 를 먼저 올리고 **그 배포가 끝날 때까지 기다린 뒤** host 를 올리면 그 조합이
# 성립하지 않는다. 남는 건 반대 방향(옛 host + 새 remote)뿐이고, 그건
# "remote 는 한 배포 주기만큼 하위호환을 유지한다" 규칙 하나로 덮인다.
#
# 완료 판정은 `deployment.all` 의 status 로 한다 — `mf-version.json` 변화로 하면
# 이미지가 재사용된 배포에서 영영 안 온다(known-issues I-8).
#
# ## 전제 — 세 앱의 Autodeploy 를 끈다
#
# 안 끄면 push 로도 뜨고 이 워크플로의 API 호출로도 떠서 **이중 배포**가 된다.
# 그러면 순서 보장도 같이 사라진다.
name: deploy

on:
  push:
    # 경로 필터를 걸지 않는다. 어떤 앱을 배포할지는 아래 `detect` 가 정한다 —
    # Dokploy 의 Watch Paths 를 여기로 옮겨온 셈이다.
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: '배포 대상'
        type: choice
        options: [auto, all, remotes, host]
        default: auto

# 배포는 건너뛰면 안 된다. 뒤 실행이 앞 실행을 취소하면 그 커밋은 아무 데도 안 올라간다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HOST_URL: ${{ vars.MF_HOST_URL || 'https://mfa.lakegreen.net' }}
  CATALOG_URL: ${{ vars.MF_CATALOG_URL || 'https://mfa-catalog.lakegreen.net' }}
  CART_URL: ${{ vars.MF_CART_URL || 'https://mfa-cart.lakegreen.net' }}
  DOKPLOY_URL: ${{ vars.DOKPLOY_URL || 'https://dokploy.lakegreen.net' }}

jobs:
  detect:
    name: 배포 대상 판별
    runs-on: ubuntu-latest
    outputs:
      remotes: ${{ steps.pick.outputs.remotes }}
      host: ${{ steps.pick.outputs.host }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: pick
        name: 무엇을 배포할지 결정
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          emit() {
            echo "remotes=$1" >> "$GITHUB_OUTPUT"
            echo "host=$2" >> "$GITHUB_OUTPUT"
            echo "대상 — remotes=$1 host=$2"
          }

          if [ "$EVENT" = "workflow_dispatch" ] && [ "$TARGET" != "auto" ]; then
            case "$TARGET" in
              all)     emit '["catalog","cart"]' true ;;
              remotes) emit '["catalog","cart"]' false ;;
              host)    emit '[]' true ;;
            esac
            exit 0
          fi

          # 첫 푸시·force push 후에는 BEFORE 커밋이 없을 수 있다. 그때는 전부 대상으로 본다.
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            emit '["catalog","cart"]' true
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "$AFTER")"

          # 공유 코드는 세 이미지가 전부 다시 빌드해야 한다.
          # `.dockerignore` 가 여기 있는 이유: 그 파일이 빌드 컨텍스트를 정하므로 이미지가
          # 통째로 달라진다. 빠뜨려서 배포가 안 물었던 적이 있다(known-issues I-7).
          if echo "$CHANGED" | grep -qE '^(packages/|scripts/|pnpm-lock\.yaml|\.dockerignore)'; then
            emit '["catalog","cart"]' true
            exit 0
          fi

          # `grep -q … && ARR+=(…)` 는 못 쓴다. 매치가 없으면 그 문장이 실패로 끝나
          # `set -e` 가 스크립트를 죽인다.
          SELECTED=()
          if echo "$CHANGED" | grep -q '^apps/remote-catalog/'; then SELECTED+=('"catalog"'); fi
          if echo "$CHANGED" | grep -q '^apps/remote-cart/'; then SELECTED+=('"cart"'); fi

          HOST=false
          if echo "$CHANGED" | grep -q '^apps/host/'; then HOST=true; fi

          if [ ${#SELECTED[@]} -eq 0 ]; then
            emit '[]' "$HOST"
          else
            IFS=,
            emit "[${SELECTED[*]}]" "$HOST"
          fi

  remotes:
    name: ${{ matrix.remote }} 배포
    needs: detect
    if: needs.detect.outputs.remotes != '[]'
    runs-on: ubuntu-latest
    strategy:
      # 한 remote 가 실패해도 다른 remote 는 끝까지 간다. 둘은 독립된 배포다.
      fail-fast: false
      matrix:
        remote: ${{ fromJSON(needs.detect.outputs.remotes) }}
    steps:
      # 로컬 composite action 을 쓰려면 저장소가 체크아웃돼 있어야 한다.
      - uses: actions/checkout@v5

      - id: baseline
        name: 배포 전 버전 기록
        env:
          REMOTE: ${{ matrix.remote }}
        run: |
          set -euo pipefail
          REMOTE_URL="$([ "$REMOTE" = catalog ] && echo "$CATALOG_URL" || echo "$CART_URL")"
          echo "remote_url=$REMOTE_URL" >> "$GITHUB_OUTPUT"

          # 못 읽어도 진행한다 — 첫 배포이거나 remote 가 잠깐 안 뜬 것이다.
          BEFORE="$(curl -fsS --max-time 10 "$REMOTE_URL/mf-version.json" | jq -r '.version' || echo '')"
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "배포 전 버전: ${BEFORE:-(읽지 못함)}"

      - uses: ./.github/actions/dokploy-deploy
        with:
          dokploy-url: ${{ env.DOKPLOY_URL }}
          api-key: ${{ secrets.DOKPLOY_API_KEY }}
          # GHA 에는 삼항이 없어서 `조건 && A || B` 를 쓴다(공식 문서 관용구).
          # ⚠️ **두 조건을 다 적어야 한다.** 빈 문자열은 falsy 라
          # `catalog && CATALOG || CART` 로 쓰면 CATALOG 가 비었을 때 **cart 의 id 로 넘어간다** —
          # catalog 를 배포하라는 job 이 조용히 cart 를 배포하고 로그에는 성공으로 남는다.
          application-id: "${{ (matrix.remote == 'catalog' && vars.DOKPLOY_APP_CATALOG) || (matrix.remote == 'cart' && vars.DOKPLOY_APP_CART) || '' }}"
          label: ${{ matrix.remote }}

      - name: 새 버전이 공표됐는지 확인 (게이트가 아니다)
        env:
          REMOTE_URL: ${{ steps.baseline.outputs.remote_url }}
          BEFORE: ${{ steps.baseline.outputs.before }}
          # 배포가 `done` 이어도 컨테이너 교체가 몇 초 늦을 수 있어 잠깐 본다.
          # 여기서 실패시키지 않는다 — 이미지가 그대로면(캐시 히트) 버전은 영영 안 바뀐다.
          WAIT_SECONDS: '120'
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + WAIT_SECONDS ))

          while :; do
            NOW="$(curl -fsS --max-time 10 "$REMOTE_URL/mf-version.json" | jq -r '.version' 2>/dev/null || echo '')"

            if [ -n "$NOW" ] && [ "$NOW" != "$BEFORE" ]; then
              echo "새 버전 공표됨: $NOW"
              echo "  - 버전: \`$NOW\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::notice::버전이 그대로다(${NOW:-없음}). 빌드 컨텍스트가 이전과 같아 이미지가 재사용됐을 수 있다."
              echo "  - 버전: \`${NOW:-?}\` (변화 없음 — 이미지 재사용)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            sleep 10
          done

  host:
    name: host 배포
    needs: [detect, remotes]
    # remote 를 안 건드린 push 여도 host 는 떠야 한다. `always()` 없이 `needs` 를 쓰면
    # 건너뛴 job 때문에 이 job 까지 같이 건너뛴다.
    if: |
      always() &&
      needs.detect.outputs.host == 'true' &&
      needs.detect.result == 'success' &&
      needs.remotes.result != 'failure' &&
      needs.remotes.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/dokploy-deploy
        with:
          dokploy-url: ${{ env.DOKPLOY_URL }}
          api-key: ${{ secrets.DOKPLOY_API_KEY }}
          application-id: ${{ vars.DOKPLOY_APP_HOST }}
          label: host

  revalidate:
    name: ${{ matrix.remote }} 캐시 무효화
    needs: [detect, remotes, host]
    # **host 를 새로 배포했으면 필요 없다.** 새 컨테이너는 빈 캐시로 뜨므로 첫 요청이
    # 이미 새 remote 로 굽는다. 무효화는 "host 는 그대로인데 remote 만 바뀐" 경우의 것이다.
    if: |
      always() &&
      needs.detect.outputs.remotes != '[]' &&
      needs.detect.outputs.host != 'true' &&
      needs.remotes.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        remote: ${{ fromJSON(needs.detect.outputs.remotes) }}
    steps:
      - name: host 캐시 무효화
        env:
          REMOTE: ${{ matrix.remote }}
          MF_REVALIDATE_SECRET: ${{ secrets.MF_REVALIDATE_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${MF_REVALIDATE_SECRET:-}" ]; then
            echo "::error::MF_REVALIDATE_SECRET 이 없다. Dokploy 의 host 런타임 env 와 같은 값을 저장소 Secret 으로 넣는다."
            exit 1
          fi

          # 웹훅은 warm 을 먼저 하고 실패하면 캐시를 건드리지 않은 채 502 로 중단한다.
          # 그래서 재시도가 안전하다 — 부분 적용 상태가 생기지 않는다.
          for ATTEMPT in 1 2 3 4 5; do
            BODY="$(curl -sS --max-time 60 -w '\n%{http_code}' \
              -X POST "$HOST_URL/api/mf-revalidate" \
              -H "x-mf-secret: $MF_REVALIDATE_SECRET" \
              -H 'content-type: application/json' \
              -d "{\"remote\":\"$REMOTE\"}" || true)"

            STATUS="$(echo "$BODY" | tail -n1)"
            JSON="$(echo "$BODY" | sed '$d')"

            if [ "$STATUS" = "200" ] && [ "$(echo "$JSON" | jq -r '.ok')" = "true" ]; then
              VERSION="$(echo "$JSON" | jq -r '.version')"
              WARMED="$(echo "$JSON" | jq -r '.warmed')"
              echo "무효화 완료 — version=$VERSION warmed=$WARMED"
              {
                echo "### $REMOTE 무효화"
                echo ""
                echo "- 버전: \`$VERSION\`"
                echo "- warm: \`$WARMED\`"
                echo "- 시도: $ATTEMPT 회"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "시도 $ATTEMPT 실패 (HTTP $STATUS): $(echo "$JSON" | jq -c '.' 2>/dev/null || echo "$JSON")"
            sleep $(( ATTEMPT * 10 ))
          done

          echo "::error::웹훅이 5회 모두 실패했다. host 페이지 캐시는 그대로다(웹훅이 캐시를 건드리기 전에 중단한다)."
          exit 1
