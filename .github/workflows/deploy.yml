# 배포 파이프라인 — 순서는 여기서 만든다
#
# ## 왜 GitHub Actions 가 순서를 쥐나
#
# Dokploy 에는 **앱 사이의 순서 개념이 없다.** 앱마다 "이 경로가 바뀌면 나를 빌드해라"
# (Watch Paths)가 있을 뿐이라, 한 push 가 세 앱을 동시에 물면 누가 먼저 끝날지 모른다.
# 공식 문서도 순서가 필요하면 CI 에서 API 로 트리거하라고 말한다
# (docs.dokploy.com — Auto deploy > API Method, `POST /api/application.deploy`).
#
# ## 순서가 왜 필요한가 — 버전 스큐
#
# host 는 커밋된 MF DTS 로 컴파일되지만 런타임에는 **배포된** remote 를 받는다
# (`mf-version.json` 이 공표한 버전으로 핀한다). 그래서 host 가 먼저 뜨면
# **새 host 코드 + 옛 remote 번들** 조합이 생긴다. 타입 검사는 이걸 못 잡는다 —
# 양쪽 다 같은 커밋의 타입으로 컴파일되기 때문이다.
#
#   필수 prop 추가·이름 변경 → 옛 컴포넌트가 `undefined` 를 받는다 → 터지거나 오동작
#   옵셔널 prop 추가         → 옛 컴포넌트가 조용히 무시한다 (에러가 안 나서 더 위험)
#
# remote 를 먼저 올리고 **그 배포가 끝날 때까지 기다린 뒤** host 를 올리면 그 조합이
# 성립하지 않는다. 남는 건 반대 방향(옛 host + 새 remote)뿐이고, 그건
# "remote 는 한 배포 주기만큼 하위호환을 유지한다" 규칙 하나로 덮인다.
#
# 완료 판정은 `deployment.all` 의 status 로 한다 — `mf-version.json` 변화로 하면
# 이미지가 재사용된 배포에서 영영 안 온다(known-issues I-8).
#
# ## 전제 — 세 앱의 Autodeploy 를 끈다
#
# 안 끄면 push 로도 뜨고 이 워크플로의 API 호출로도 떠서 **이중 배포**가 된다.
# 그러면 순서 보장도 같이 사라진다.
name: deploy

on:
  push:
    # 경로 필터를 걸지 않는다. 어떤 앱을 배포할지는 아래 `detect` 가 정한다 —
    # Dokploy 의 Watch Paths 를 여기로 옮겨온 셈이다.
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: '배포 대상'
        type: choice
        options: [auto, all, remotes, host]
        default: auto

# 배포는 건너뛰면 안 된다. 뒤 실행이 앞 실행을 취소하면 그 커밋은 아무 데도 안 올라간다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# 도메인은 저장소 Variables 한 곳에만 둔다. 폴백 리터럴을 두면 변수를 안 넣은 저장소에서
# 워크플로가 남의 도메인을 조용히 때린다 — 안 붙어야 할 때 붙는 편이 낫다.
#
# ## remote 별 변수를 여기 나열하지 않는다
#
# 예전에는 `CATALOG_URL` · `CART_URL` 을 적고 아래에서 삼항으로 골랐다.
#
#   REMOTE_URL="$([ "$REMOTE" = catalog ] && echo "$CATALOG_URL" || echo "$CART_URL")"
#
# remote 가 셋이 되는 순간 **catalog 가 아닌 모든 remote 가 cart 의 URL 을 읽는다.**
# 그리고 그 URL 로 배포 전후 버전을 비교해 성공으로 끝난다 — 로그에 아무 흔적이 없다.
# `application-id` 쪽에서 같은 함정을 이미 한 번 밟았다(아래 주석 참고).
#
# 그래서 remote → 변수 이름 매핑을 `@mfa/remote-config` 의 `ciUrlVar` · `ciDokployAppVar`
# 로 옮기고, 여기서는 저장소 Variables **전체**를 JSON 한 덩이로 받는다. matrix 항목이
# 자기 변수 이름을 들고 오므로 remote 가 늘어도 이 파일은 안 바뀐다.
#
# `vars` 는 정의상 비밀이 아니다(비밀은 `secrets`). 통째로 넘겨도 노출되는 게 없다.
env:
  HOST_URL: ${{ vars.MF_HOST_URL }}
  DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
  ALL_VARS: ${{ toJSON(vars) }}

jobs:
  detect:
    name: 배포 대상 판별
    runs-on: ubuntu-latest
    outputs:
      remotes: ${{ steps.pick.outputs.remotes }}
      host: ${{ steps.pick.outputs.host }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: pick
        uses: ./.github/actions/detect-targets
        with:
          event-name: ${{ github.event_name }}
          target: ${{ inputs.target }}
          before: ${{ github.event.before }}
          after: ${{ github.sha }}

  remotes:
    name: ${{ matrix.remote.name }} 배포
    needs: detect
    if: needs.detect.outputs.remotes != '[]'
    runs-on: ubuntu-latest
    strategy:
      # 한 remote 가 실패해도 다른 remote 는 끝까지 간다. 둘은 독립된 배포다.
      fail-fast: false
      matrix:
        # 항목은 문자열이 아니라 `{ name, urlVar, appVar, workspaceDir }` 객체다.
        # 변수 이름 규칙은 `@mfa/remote-config` 가 정하고 detect 가 실어 보낸다.
        remote: ${{ fromJSON(needs.detect.outputs.remotes) }}
    steps:
      # 로컬 composite action 을 쓰려면 저장소가 체크아웃돼 있어야 한다.
      - uses: actions/checkout@v5

      - id: cfg
        name: 이 remote 의 배포 설정 찾기
        env:
          REMOTE: ${{ matrix.remote.name }}
          URL_VAR: ${{ matrix.remote.urlVar }}
          APP_VAR: ${{ matrix.remote.appVar }}
        run: |
          set -euo pipefail

          # `jq -e` 는 결과가 null 이면 **0 이 아닌 코드로 끝난다.** 변수를 안 만들어 둔
          # remote 를 배포하려 하면 여기서 죽는다 — 옛 삼항 사슬처럼 다른 remote 의 값으로
          # 조용히 넘어가지 않는다. 그게 이 step 이 존재하는 이유다.
          # ⚠️ `echo "x=$(pick …)"` 로 쓰면 안 된다. `pick` 이 서브셸에서 죽어도 바깥
          # `echo` 는 성공해서 **빈 값이 그대로 출력으로 나간다.** 변수에 먼저 받아야
          # `set -e` 가 command substitution 의 실패를 잡는다.
          pick() {
            jq -er --arg k "$1" '.[$k] // empty' <<<"$ALL_VARS" || {
              echo "::error::저장소 Variable '$1' 이(가) 없습니다 (remote '$REMOTE'). Settings > Variables 에 추가하세요."
              return 1
            }
          }

          REMOTE_URL="$(pick "$URL_VAR")"
          APP_ID="$(pick "$APP_VAR")"

          {
            echo "remote_url=$REMOTE_URL"
            echo "app_id=$APP_ID"
          } >> "$GITHUB_OUTPUT"

      - id: baseline
        name: 배포 전 버전 기록
        env:
          REMOTE_URL: ${{ steps.cfg.outputs.remote_url }}
        run: |
          set -euo pipefail
          # 못 읽어도 진행한다 — 첫 배포이거나 remote 가 잠깐 안 뜬 것이다.
          BEFORE="$(curl -fsS --max-time 10 "$REMOTE_URL/mf-version.json" | jq -r '.version' || echo '')"
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "배포 전 버전: ${BEFORE:-(읽지 못함)}"

      - uses: ./.github/actions/dokploy-deploy
        with:
          dokploy-url: ${{ env.DOKPLOY_URL }}
          api-key: ${{ secrets.DOKPLOY_API_KEY }}
          application-id: ${{ steps.cfg.outputs.app_id }}
          label: ${{ matrix.remote.name }}

      - uses: ./.github/actions/mf-version-check
        with:
          remote-url: ${{ steps.cfg.outputs.remote_url }}
          before: ${{ steps.baseline.outputs.before }}

  host:
    name: host 배포
    needs: [detect, remotes]
    # remote 를 안 건드린 push 여도 host 는 떠야 한다. `always()` 없이 `needs` 를 쓰면
    # 건너뛴 job 때문에 이 job 까지 같이 건너뛴다.
    if: |
      always() &&
      needs.detect.outputs.host == 'true' &&
      needs.detect.result == 'success' &&
      needs.remotes.result != 'failure' &&
      needs.remotes.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/dokploy-deploy
        with:
          dokploy-url: ${{ env.DOKPLOY_URL }}
          api-key: ${{ secrets.DOKPLOY_API_KEY }}
          application-id: ${{ vars.DOKPLOY_APP_HOST }}
          label: host

  revalidate:
    name: ${{ matrix.remote.name }} 캐시 무효화
    needs: [detect, remotes, host]
    # **host 를 새로 배포했으면 필요 없다.** 새 컨테이너는 빈 캐시로 뜨므로 첫 요청이
    # 이미 새 remote 로 굽는다. 무효화는 "host 는 그대로인데 remote 만 바뀐" 경우의 것이다.
    if: |
      always() &&
      needs.detect.outputs.remotes != '[]' &&
      needs.detect.outputs.host != 'true' &&
      needs.remotes.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        remote: ${{ fromJSON(needs.detect.outputs.remotes) }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/mf-revalidate
        with:
          host-url: ${{ env.HOST_URL }}
          remote: ${{ matrix.remote.name }}
          secret: ${{ secrets.MF_REVALIDATE_SECRET }}
