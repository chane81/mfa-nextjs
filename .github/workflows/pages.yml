# 문서 공개 — `docs/visual/` 을 GitHub Pages 로 올린다
#
# ## 왜 필요한가
#
# 그림(`anatomy.html` · 시네마 셋)은 단독 HTML 이다. GitHub 저장소 화면은 HTML 을
# **렌더링하지 않고 소스로 보여준다.** 그래서 README 의 링크를 눌러도 그림을 볼 수 없었다 —
# 받아서 브라우저로 열라는 안내가 붙어 있던 이유다. Pages 로 올리면 그 링크가 바로 열린다.
#
#   https://chane81.github.io/mfa-nextjs/            → visual/index.html 이 해부도로 보낸다
#   https://chane81.github.io/mfa-nextjs/anatomy.html
#
# ## 왜 `docs/` 가 아니라 `docs/visual/` 인가
#
# 올릴 것은 **브라우저로 보는 것뿐**이다. 마크다운은 Pages 가 렌더링하지 않으므로 올려도
# 소스가 그대로 노출될 뿐이고, GitHub 저장소 화면에서 읽는 편이 낫다. 그래서 그림만 올리고
# 그 폴더를 사이트 루트로 삼는다 — 공개 주소가 평평해진다(`/anatomy.html`).
#
# ## 그 대신 마크다운 링크는 **반드시** 치환돼야 한다
#
# 그림은 근거 문서를 `../02-architecture/*.md` 로 가리키는데, 그 파일들은 올라가지 않는다.
# 그래서 각 HTML 의 스크립트가 **서빙된 페이지에서는(= `file:` 이 아니면)** 그 링크를
# GitHub blob 주소로 바꿔 단다. 상대 경로(`../`)를 유지해야 그 치환이 먹는다.
# 로컬에서 파일로 열 때는 치환하지 않는다 — 그때는 상대 경로가 그대로 맞는다.
#
# ## 이 워크플로가 배포와 무관한 이유
#
# 앱 배포(`deploy.yml`)와 아무 것도 공유하지 않는다. 여기서 실패해도 앱은 그대로 뜬다.
# 반대로 `docs/` 만 바뀐 커밋은 앱 이미지를 바꾸지 않으므로(`.dockerignore`) 이쪽만 돈다.
name: pages

on:
  push:
    branches: [main]
    # 올리는 것이 `docs/visual/` 뿐이라 마크다운만 바뀐 커밋은 사이트를 바꾸지 않는다.
    # (그림 안의 `.md` 링크는 GitHub blob 주소로 나가므로 문서를 고쳐도 재배포가 필요 없다.)
    paths:
      - 'docs/visual/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 배포는 하나만 돈다. 다만 취소하지 않는다 — 뒤 실행이 앞 실행을 끊으면 그 커밋의 문서가
# 아무 데도 안 올라간다.
concurrency:
  group: pages
  cancel-in-progress: false

# `id-token: write` 는 deploy-pages 가 OIDC 로 배포 토큰을 받는 데 쓴다. 이 워크플로는
# 저장소에 아무것도 쓰지 않는다.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: 문서 배포
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v6

      # 빌드가 없다. `docs/visual/` 을 그대로 올린다 — 정적 HTML 다섯 장과 공용 엔진뿐이다.
      # 이 폴더가 사이트 루트가 되므로 `visual/index.html` 이 `/` 를 받는다.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/visual

      - id: deploy
        uses: actions/deploy-pages@v5
