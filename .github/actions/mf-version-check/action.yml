name: remote 버전 공표 확인
description: 배포 뒤 remote 가 새 `mf-version.json` 을 내보내는지 잠깐 지켜본다 (게이트가 아니다)

# ⚠️ **이 확인은 실패시키지 않는다.** 배포 완료 판정은 `dokploy-deploy` 가 배포 상태로 하고,
# 여기는 사람이 로그에서 보라고 남기는 관측일 뿐이다.
#
# 버전이 안 바뀌는 것이 정상인 경우가 있다: 빌드 컨텍스트가 이전과 같으면 Docker 가 레이어를
# 재사용해 `.mf-version` 이 그대로다(known-issues I-8). 그때 여기서 죽이면 정상 배포가
# 빨간불이 된다.
#
# 그래도 지켜보는 이유: 배포 상태가 `done` 이어도 컨테이너 교체가 몇 초 늦을 수 있어서,
# 실제로 새 번들이 떴는지를 확인할 수 있는 유일한 지점이 여기다.
#
# ## 왜 30초인가
#
# 실측(32차): `done` 이 찍히고 새 버전이 공표되기까지 **0.4~0.6초**다. 30초는 그 50배다.
# 넉넉히 잡을 이유가 없는 게, 이 대기는 **버전이 안 바뀌는 배포에서 전액 청구된다** —
# 이미지가 재사용되면 아무리 기다려도 안 바뀌므로(I-8) 매번 시한을 다 쓴다.
# 120초로 두던 때는 그런 배포마다 2분을 버렸다.

inputs:
  remote-url:
    description: remote 공개 오리진
    required: true
  before:
    description: 배포 전에 읽어둔 버전 (못 읽었으면 빈 문자열)
    required: false
    default: ''
  wait-seconds:
    description: 새 버전을 기다릴 최대 시간 (공표는 실측 0.5초 안에 온다)
    required: false
    default: '30'

runs:
  using: composite
  steps:
    - name: 새 버전이 공표됐는지 확인 (게이트가 아니다)
      shell: bash
      env:
        REMOTE_URL: ${{ inputs.remote-url }}
        BEFORE: ${{ inputs.before }}
        WAIT_SECONDS: ${{ inputs.wait-seconds }}
      run: |
        set -euo pipefail
        DEADLINE=$(( $(date +%s) + WAIT_SECONDS ))

        while :; do
          NOW="$(curl -fsS --max-time 10 "$REMOTE_URL/mf-version.json" | jq -r '.version' 2>/dev/null || echo '')"

          if [ -n "$NOW" ] && [ "$NOW" != "$BEFORE" ]; then
            echo "새 버전 공표됨: $NOW"
            echo "  - 버전: \`$NOW\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$(date +%s)" -ge "$DEADLINE" ]; then
            echo "::notice::버전이 그대로다(${NOW:-없음}). 빌드 컨텍스트가 이전과 같아 이미지가 재사용됐을 수 있다."
            echo "  - 버전: \`${NOW:-?}\` (변화 없음 — 이미지 재사용)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 5초. `done` 이 찍히고 새 버전이 공표되기까지는 실측 0.4~0.6초다 —
          # 촘촘히 볼수록 이 단계는 그만큼 빨리 끝난다.
          sleep 5
        done
