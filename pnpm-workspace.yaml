packages:
  - 'apps/*'
  - 'packages/*'

# 공용 의존성 버전의 SSOT. 패키지들은 `catalog:` 로만 가리킨다.
#
# 여기 없는 것은 그 앱 하나만 쓰는 의존성이다(예: remote-cart 의 @rsbuild/*,
# remote-catalog 의 vite). 두 곳 이상이 쓰거나, 같은 계열끼리 버전이 어긋나면
# 곧장 런타임 사고가 되는 것(react / MF / tailwind / turbo)만 올린다.
catalog:
  # React 19 — host 와 remote 가 **같은 인스턴스**를 공유해야 한다.
  # 여기가 어긋나면 remote 가 자기 React 를 번들해 hook 이 깨진다.
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.2
  '@types/react-dom': ^19.2.2

  # Module Federation — runtime(host) · cli(DTS) · 번들러 플러그인(remote) 이
  # 같은 프로토콜 세대여야 remoteEntry 를 서로 읽는다.
  '@module-federation/runtime': ^2.8.2
  '@module-federation/cli': ^2.8.2
  '@module-federation/rsbuild-plugin': ^2.8.2
  '@module-federation/vite': ^1.20.7

  # Next.js 16 — 본체와 eslint 플러그인을 같이 올린다.
  next: ^16.3.1
  '@next/eslint-plugin-next': ^16.3.1

  # Tailwind 4 — postcss(host·cart) 와 vite(catalog) 경로가 같은 엔진을 써야
  # 같은 토큰에서 같은 CSS 가 나온다.
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  '@tailwindcss/vite': ^4.3.3

  # Turborepo — 본체와 eslint 플러그인 버전을 묶는다.
  turbo: 2.10.9
  eslint-plugin-turbo: ^2.10.9

  # 툴체인
  typescript: 6.0.3
  eslint: ^10.8.1
  '@eslint/js': ^10.0.1
  '@types/node': ^24.10.1
  concurrently: ^9.2.1
  '@vitejs/plugin-react': ^6.0.5

catalogs:
  # peerDependencies 전용. 소비자 쪽 범위는 **일부러 느슨하게** 둔다 —
  # 기본 카탈로그(^19.2.8)를 peer 에 그대로 쓰면 라이브러리가 패치 버전까지
  # 강제하게 된다.
  peers:
    react: ^19.0.0

# `pnpm add` 가 카탈로그를 우회하지 못하게 한다.
# strict: 카탈로그에 있는 패키지는 카탈로그 범위로만 추가된다. 범위 밖 버전을
# 넣으려 하면 설치가 실패한다 — SSOT 가 조용히 갈라지는 대신 그 자리에서 막힌다.
catalogMode: strict

# package.json 의 engines.node 범위를 **실패**로 만든다.
#
# 이게 없으면 범위를 벗어난 Node 에서도 경고만 찍고 설치를 끝낸다(pnpm 11.22.0 실측).
#   [WARN] Unsupported engine: wanted: {"node":">=24.19.0 <25"} (current: {"node":"v26.5.0"})
# 그러면 실패가 설치 시점이 아니라 dev 서버나 프리렌더 한복판으로 밀린다. 거기서 나오는
# 에러는 Node 버전을 한 글자도 언급하지 않는다 — 타입 스트리핑이 안 되면
# `SyntaxError: Missing initializer in const declaration` 이 전부다.
engineStrict: true

minimumReleaseAgeExclude:
  - '@module-federation/vite@1.20.7'
  - '@next/env@16.3.1'
  - '@next/eslint-plugin-next@16.3.1'
  - '@next/swc-darwin-arm64@16.3.1'
  - '@next/swc-darwin-x64@16.3.1'
  - '@next/swc-linux-arm64-gnu@16.3.1'
  - '@next/swc-linux-arm64-musl@16.3.1'
  - '@next/swc-linux-x64-gnu@16.3.1'
  - '@next/swc-linux-x64-musl@16.3.1'
  - '@next/swc-win32-arm64-msvc@16.3.1'
  - '@next/swc-win32-x64-msvc@16.3.1'
  - '@rsbuild/core@2.1.13'
  - '@rspack/binding-darwin-arm64@2.1.10'
  - '@rspack/binding-darwin-x64@2.1.10'
  - '@rspack/binding-linux-arm64-gnu@2.1.10'
  - '@rspack/binding-linux-arm64-musl@2.1.10'
  - '@rspack/binding-linux-ppc64-gnu@2.1.10'
  - '@rspack/binding-linux-riscv64-gnu@2.1.10'
  - '@rspack/binding-linux-riscv64-musl@2.1.10'
  - '@rspack/binding-linux-s390x-gnu@2.1.10'
  - '@rspack/binding-linux-x64-gnu@2.1.10'
  - '@rspack/binding-linux-x64-musl@2.1.10'
  - '@rspack/binding-wasm32-wasi@2.1.10'
  - '@rspack/binding-win32-arm64-msvc@2.1.10'
  - '@rspack/binding-win32-ia32-msvc@2.1.10'
  - '@rspack/binding-win32-x64-msvc@2.1.10'
  - '@rspack/binding@2.1.10'
  - '@rspack/core@2.1.10'
  - next@16.3.1

# Next.js / Vite / Rsbuild 가 각자 네이티브 바이너리를 빌드하므로 승인 목록에 등록
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - unrs-resolver
