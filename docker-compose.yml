# 배포 전 로컬 검증용 compose.
#
# Dokploy 는 앱마다 **별도 Application** 으로 올린다(remote 만 재배포해도 host 가 안 죽는지
# 검증하는 게 이 저장소의 미완 항목이라, 한 덩어리로 묶으면 그 검증이 불가능하다).
# 이 파일은 "이미지 4개가 실제로 뜨고 서로 물리는지"를 로컬에서 먼저 확인하는 용도다.
#
#   docker compose up --build
#   curl -s localhost:3000/checkout | grep 주문서   # remote SSR 확인
#
# 주의: PUBLIC_URL 이 localhost 로 굳으므로 이 이미지는 배포용이 아니다.
services:
  remote-catalog:
    build:
      context: .
      dockerfile: apps/remote-catalog/Dockerfile
      args:
        REMOTE_CATALOG_PUBLIC_URL: http://localhost:3001
    ports: ["3001:3001"]
    volumes: ["catalog-dist:/data"]

  remote-cart:
    build:
      context: .
      dockerfile: apps/remote-cart/Dockerfile
      args:
        REMOTE_CART_PUBLIC_URL: http://localhost:3002
    ports: ["3002:3002"]
    volumes: ["cart-dist:/data"]

  zone-checkout:
    build:
      context: .
      dockerfile: apps/zone-checkout/Dockerfile
    ports: ["3003:3003"]

  host:
    build:
      context: .
      dockerfile: apps/host/Dockerfile
      args:
        # 브라우저가 읽는 값 → 호스트 머신에서 닿는 주소여야 한다
        NEXT_PUBLIC_REMOTE_CATALOG_ENTRY: http://localhost:3001/mf-manifest.json
        NEXT_PUBLIC_REMOTE_CART_ENTRY: http://localhost:3002/mf-manifest.json
        ZONE_CHECKOUT_URL: http://zone-checkout:3003
    ports: ["3000:3000"]
    environment:
      # host **서버**가 읽는 값 → 컨테이너 네트워크 내부 주소
      REMOTE_CATALOG_SSR_ENTRY: http://remote-catalog:3001/mf-server.cjs
      REMOTE_CART_SSR_ENTRY: http://remote-cart:3002/mf-server.cjs
      ZONE_CHECKOUT_URL: http://zone-checkout:3003
      # 서버가 코드를 받아 실행하는 오리진 허용목록
      REMOTE_ALLOWED_ORIGINS: http://remote-catalog:3001,http://remote-cart:3002
      MF_REVALIDATE_SECRET: local-dev-secret
      # 로컬 compose 는 서명 없이 빌드된다(build secret 미전달). 강제하면 안 뜬다.
      MF_REQUIRE_SIGNATURE: "0"
    depends_on: [remote-catalog, remote-cart, zone-checkout]

volumes:
  catalog-dist:
  cart-dist:
