# 배포 전 로컬 검증용 compose. 배포는 앱마다 별도 Application 이다(remote 단독 재배포 검증).
#
#   pnpm docker:up                                  # LAN IP 해석 → remote → host
#   curl -s localhost:3000/checkout | grep 주문서   # remote SSR 확인
#   pnpm docker:down
#
# **주소가 맥의 LAN IP 인 이유**: 같은 remote 주소를 브라우저 · host 빌드(compose 네트워크
# 밖) · host 런타임(안) 셋이 읽는다. 셋 다에서 통하는 건 LAN IP 뿐 — localhost 도
# `remote-catalog` 도 `host.docker.internal` 도 셋 중 하나에서 깨진다.
# `MFA_HOST_IP` 는 `docker:up` 이 셸 변수로 넘긴다. `:-unset-mfa-host-ip` 는 그 변수 없이도
# `down`·`logs`·`ps` 가 돌게 하는 폴백이다(compose 는 파일 전체를 보간한다). 빌드에 걸리면
# DNS 가 이 이름에서 죽어 원인이 드러난다.
#
# **두 번에 나눠 올리는 이유**: host 빌드가 프리렌더 중 remote SSR 번들을 HTTP 로 받아
# 실행한다. `depends_on` 은 런타임 순서지 빌드 순서가 아니라 이걸 못 한다 — `healthcheck`
# + `up --wait` 가 맡는다. (docs/03-setup/01-getting-started.md)
#
# ⚠️ 배포용 아님 — 오리진이 LAN IP 로 굳는다. 네트워크가 바뀌면 재빌드해야 한다.
# ⚠️ 포트·env 이름의 원본은 `packages/remote-config`. 정적 YAML 이라 여기만 손으로 맞춘다.
#
services:
  remote-catalog:
    build:
      context: .
      dockerfile: apps/remote-catalog/Dockerfile
      args:
        # 자산 URL 접두사. 브라우저가 이 주소에서 청크를 받는다.
        REMOTE_CATALOG_PUBLIC_URL: http://${MFA_HOST_IP:-unset-mfa-host-ip}:3001
    ports: ['3001:3001']
    volumes: ['catalog-dist:/data']
    environment:
      # 볼륨에 남길 버전 개수. 기본값과 같은 값이지만 명시한다 — 폴백만 도는 env 는
      # 주입 지점을 찾는 사람에게 "어디서 넣는지 없다"는 의문만 남긴다.
      REMOTE_KEEP_VERSIONS: '5'
    # `up --wait` 가 기다리는 조건. node:slim 에 curl 이 없어 node fetch 로 확인한다.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/mf-version.json').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  remote-cart:
    build:
      context: .
      dockerfile: apps/remote-cart/Dockerfile
      args:
        REMOTE_CART_PUBLIC_URL: http://${MFA_HOST_IP:-unset-mfa-host-ip}:3002
    ports: ['3002:3002']
    volumes: ['cart-dist:/data']
    environment:
      REMOTE_KEEP_VERSIONS: '5'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/mf-version.json').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  host:
    build:
      context: .
      dockerfile: apps/host/Dockerfile
      args:
        # ① 번들에 구워지는 매니페스트 URL ② 프리렌더가 받아가는 SSR 번들 URL
        REMOTE_CATALOG_PUBLIC_URL: http://${MFA_HOST_IP:-unset-mfa-host-ip}:3001
        REMOTE_CART_PUBLIC_URL: http://${MFA_HOST_IP:-unset-mfa-host-ip}:3002
    ports: ['3000:3000']
    environment:
      # host 서버가 런타임에 읽는 값(②뿐 — ①은 이미 번들에 구워졌다).
      REMOTE_CATALOG_PUBLIC_URL: http://${MFA_HOST_IP:-unset-mfa-host-ip}:3001
      REMOTE_CART_PUBLIC_URL: http://${MFA_HOST_IP:-unset-mfa-host-ip}:3002
      # REMOTE_ALLOWED_ORIGINS 는 생략한다. 미설정이면 위 오리진만 허용이라 이미 정확하다.
      MF_REVALIDATE_SECRET: local-dev-secret
      # 로컬 compose 는 서명 없이 빌드된다(build secret 미전달). 강제하면 안 뜬다.
      MF_REQUIRE_SIGNATURE: '0'
    # 기본값 `service_started` 는 서빙 전에도 통과한다. 재기동·통짜 `up` 에서 걸린다.
    depends_on:
      remote-catalog:
        condition: service_healthy
      remote-cart:
        condition: service_healthy
    # host 는 부팅이 느리다(standalone 기동 + 첫 요청). retries 를 넉넉히 둔다.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 3s

volumes:
  catalog-dist:
  cart-dist:
